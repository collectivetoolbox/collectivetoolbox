# This is the canonical source of config.toml, which it is copied to by the build script.

[build]
# rustflags = ["--cfg", "tokio_unstable"]
# You may need to adjust this depending on your system.
# This is to avoid overloading the system when building.
#jobs = 4
incremental = false
rustflags = ["-A", "warnings", "-A", "unfulfilled_lint_expectations"]
rustdocflags = ["-A", "warnings"]

[host]
rustflags = ["-A", "warnings", "-A", "unfulfilled_lint_expectations"]

[target.i586-unknown-linux-musl]
linker = "scripts/i586-musl-gcc"

# [target.x86_64-pc-windows-gnu]
# linker = "x86_64-w64-mingw32-gcc"
# ar = "x86_64-w64-mingw32-gcc-ar"

[target.x86_64-win7-windows-gnu]
linker = "x86_64-w64-mingw32-gcc"
ar = "x86_64-w64-mingw32-gcc-ar"
rustflags = ["-C", "link-arg=-fuse-ld=lld"]

[target.x86_64-unknown-freebsd]
linker = "scripts/x86_64-freebsd-clang"
ar = "ar"

# Must have [env] table as last entry in config.toml so config.vendored.toml can append to it
[env]
# Resolves 'scripts/i586-musl-gcc' relative to this config file
CC_i586_unknown_linux_musl = { value = "scripts/i586-musl-gcc", relative = true }
CC_x86_64_unknown_linux_musl = { value = "scripts/x86_64-musl-gcc", relative = true }
CC_x86_64_win7_windows_gnu = { value = "x86_64-w64-mingw32-gcc" }
CXX_x86_64_win7_windows_gnu = { value = "x86_64-w64-mingw32-g++" }
AR_x86_64_win7_windows_gnu = { value = "x86_64-w64-mingw32-gcc-ar" }
WINDRES = { value = "x86_64-w64-mingw32-windres" }
RC_x86_64_win7_windows_gnu = { value = "x86_64-w64-mingw32-windres" }
# CC_x86_64_pc_windows_gnu = { value = "x86_64-w64-mingw32-gcc" }

CC_x86_64_unknown_freebsd = { value = "scripts/x86_64-freebsd-clang", relative = true }
CXX_x86_64_unknown_freebsd = { value = "scripts/x86_64-freebsd-clang++", relative = true }
AR_x86_64_unknown_freebsd = { value = "ar" }

PKG_CONFIG_SYSROOT_DIR_i586_unknown_linux_musl = { value = "/usr/include/i386-linux-musl" }
PKG_CONFIG_SYSROOT_DIR_x86_64_unknown_linux_musl = { value = "/usr/include/x86_64-linux-musl" }
# This file gets concatenated to config.default.toml when using vendored dependencies.

# https://github.com/luukvanderduim/zbus-lockstep/issues/9
# Goes in [env] table; that must be at the end of config.toml
LOCKSTEP_XML_PATH = { value = "vendor/ctb-vendored/vendor/atspi-common/xml", relative = true }

[registries.crates-io]
protocol = "sparse"

[source.crates-io]
replace-with = "vendored-sources"

[source.vendored-sources]
directory = "vendor/ctb-vendored/vendor"

[source."https://github.com/boa-dev/boa.git"]
git = "https://github.com/boa-dev/boa.git"
rev = "ffec9244d4267406d66aef8b3c8a1d89730df5b4"
replace-with = "vendored-sources"

[source."https://github.com/rust-dark-light/dark-light.git"]
git = "https://github.com/rust-dark-light/dark-light.git"
rev = "0f18d2fbcaa5d1c175db8aae7d53428988d7e961"
replace-with = "vendored-sources"

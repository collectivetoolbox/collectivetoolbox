  <title
     id="graph-diagram-title">
    Example of nodes and relationships in a graph
    </title>
  <desc
     id="graph-diagram-desc">
    Three nodes labeled Person, Company, and Document connected by
    relationships such as works at and writes.
    </desc>
  <!-- Relationships -->
  <defs
     id="defs1">
    <marker
       style="overflow:visible"
       id="marker8"
       refX="0"
       refY="0"
       orient="auto-start-reverse"
       inkscape:stockid="Triangle arrow"
       markerWidth="1"
       markerHeight="1"
       viewBox="0 0 1 1"
       inkscape:isstock="true"
       inkscape:collect="always"
       preserveAspectRatio="xMidYMid">
      <path
         transform="scale(0.5)"
         style="fill:context-stroke;fill-rule:evenodd;stroke:context-stroke;stroke-width:1pt"
         d="M 5.77,0 -2.88,5 V -5 Z"
         id="path8" />
    </marker>
    <marker
       style="overflow:visible"
       id="marker7"
       refX="0"
       refY="0"
       orient="auto-start-reverse"
       inkscape:stockid="Triangle arrow"
       markerWidth="1"
       markerHeight="1"
       viewBox="0 0 1 1"
       inkscape:isstock="true"

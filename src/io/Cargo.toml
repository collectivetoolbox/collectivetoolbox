[package]
name = "ctb-io"
edition = "2024"

[lib]
path="io.rs"
crate-type = ["lib"]

[dependencies]
ctb-utilities = { path = "../utilities" }
ctb-io-file = { path = "./file" }
ctb-io-webui = { path = "./webui" }
ctb-formats-checksum = { path = "../formats/checksum" }
filetime = "0.2"
serde = { version = "1.0", features = ["derive"] }
anyhow = "1.0"
cfg-if = "1.0"

[target.'cfg(unix)'.dependencies]
nix = { version = "0.30", features = ["fs", "mman", "user", "ioctl"] }
libc = "0.2"
rustix = { version = "0.38", features = ["fs"] }
xattr = "1.6"

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true

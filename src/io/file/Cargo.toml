[package]
name = "ctb-io-file"
edition = "2024"

[lib]
path = "file.rs"
crate-type = ["lib"]

[dependencies]
ctb-utilities = { path = "../../utilities" }
ctb-io = { path = ".." }
ctb-io-file = { path = "../file" }
ctb-formats-checksum = { path = "../../formats/checksum" }
ctb-formats-text-extraction = { path = "../../formats/text_extraction" }
ctb-formats-time = { path = "../../formats/time" }
clap = { version = "4.5", features = ["derive"] }
nix = { version = "0.30", features = ["fs", "mman", "user"] }
xattr = "1.6"
filetime = "0.2"
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
turso = "0.6.1"
regex = "1.11"
tokio = { version = "1.49.0", features = ["full", "tracing"] }

[dev-dependencies]
tempfile = "3.27"
tracing = "0.1"

[lints]
workspace = true

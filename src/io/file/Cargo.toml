[package]
name = "ctb-io-file"
edition = "2024"

[lib]
path = "file.rs"
crate-type = ["lib"]

[dependencies]
ctb-utilities = { path = "../../utilities" }
ctb-io-environment = { path = "../environment" }
ctb-formats-unicode = { path = "../../formats/unicode" }
ctb-formats-apple-single-double = { path = "../../formats/apple_single_double" }
ctb-formats-checksum = { path = "../../formats/checksum" }
ctb-formats-dcstring = { path = "../../formats/dcstring" }
ctb-formats-text-extraction = { path = "../../formats/text_extraction" }
ctb-formats-time = { path = "../../formats/time" }
clap = { version = "4.5", features = ["derive"] }
cfg-if = "1.0"
filetime = "0.2"
anyhow = "1.0"
serde = { version = "1.0", features = ["derive", "rc"] }
serde_json = "1.0"
base64 = "0.22"
turso = "0.6.1"
regex = "1.11"
tokio = { version = "1.49.0", features = ["full", "tracing"] }

[dev-dependencies]
tempfile = "3.27"
tracing = "0.1"

[lints]
workspace = true

[target.'cfg(unix)'.dependencies]
nix = { version = "0.30", features = ["fs", "mman", "user", "ioctl"] }
libc = "0.2"
rustix = { version = "0.38", features = ["fs"] }
xattr = "1.6"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_System_IO",
    "Win32_System_Ioctl",
] }


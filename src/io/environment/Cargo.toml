[package]
name = "ctb-io-environment"
edition = "2024"

[lib]
path = "environment.rs"
crate-type = ["lib"]

[dependencies]
ctb-utilities = { path = "../../utilities" }
ctb-formats-dcstring = { path = "../../formats/dcstring" }
ctb-formats-utilities = { path = "../../formats/utilities" }
serde = { version = "1.0", features = ["derive", "rc"] }
serde_json = "1.0"
anyhow = "1.0"
smart-default = "0.7.1"
semver = "1.0"
viuer = { version = "0.11.0", features = ["icy_sixel"] }

[target.'cfg(unix)'.dependencies]
nix = { version = "0.30", features = ["time"] }

[lints]
workspace = true


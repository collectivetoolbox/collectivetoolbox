[package]
name = "ctb-workspace-ipc"
edition = "2024"

[lib]
path="ipc.rs"
crate-type = ["lib"]

[[example]]
name = "minimal-workspace"
path = "examples/minimal-workspace/main.rs"

[dependencies]
ctb-utilities = { path = "../../utilities" }
ctb-cli = { path = "../../cli" }
ctb-formats = { path = "../../formats" }
ctb-io = { path = "../../io" }
ctb-network = { path = "../../network" }
ctb-renderer = { path = "../../renderer" }
ctb-runtime = { path = "../../runtime" }
ctb-storage = { path = "../../storage" }
ctb-formats-utf-8e-128 = { path = "../../formats/utf_8e_128" }

thiserror = "2.0"
async-trait = "0.1.89"
futures-core = "0.3.31"
bytes = "1.11.0"
tokio = { version = "1.49.0", features = ["full", "tracing"] }
tokio-stream = "0.1.18"
serde = "1.0.228"
serde_json = { version = "1.0.149", features = ["arbitrary_precision"] }
postcard = { version = "1.1.3", features = ["use-std"] }
futures-util = "0.3"
tracing-subscriber = { version = "0.3.22", features = ["env-filter", "ansi", "tracing-log", "registry"] }
interprocess = { version = "2.2.3", features = ["tokio"] }
futures = "0.3"
tokio-util = { version = "0.7.18", features = ["codec"] }
uuid = { version = "1.19.0", features = [ "v4", "macro-diagnostics", "js" ] }
process-wrap = { version = "9", features = ["tokio1", "job-object"] }
nix = { version = "0.30", features = ["fs", "signal", "socket"] }
memmap2 = "0.9.9"
clap = { version = "4.5.54", features = ["cargo", "derive", "unicode"] }
once_cell = "1.21.3"

[lints]
workspace = true

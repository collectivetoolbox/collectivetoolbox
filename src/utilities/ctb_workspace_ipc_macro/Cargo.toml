[package]
name = "ctb-workspace-ipc-macro"
edition = "2024"
description = "Proc macro for generating typed workspace IPC client helpers."

[lib]
proc-macro = true

[dependencies]
proc-macro2 = { version = "1.0.105", default-features = false }
quote = { version = "1.0" }
syn = { version = "2.0", default-features = false, features = ["clone-impls", "full", "parsing", "printing", "proc-macro"] }

[lints]
workspace = true

[package]
name = "ctb-formats-utilities"
edition = "2024"

[lib]
path="utilities.rs"
crate-type = ["lib"]

[dependencies]
ctb-utilities = { path = "../../utilities" }
ctb-formats-dcdata = { path = "../dcdata" }
serde = { version = "1.0", features = ["derive"] }
flate2 = "1.1.9"
regex = "1.12"
chrono = { version = "0.4", features = ["serde"] }

[lints]
workspace = true


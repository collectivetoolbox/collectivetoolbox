[package]
name = "ctb-formats-internetarchive"
edition = "2024"

[lib]
path="internetarchive.rs"
crate-type = ["lib"]

[dependencies]
ctb-utilities = { path = "../../utilities" }

md-5 = "0.10.6"
percent-encoding = "2.3"
reqwest = { version = "0.13", features = [ "blocking" ] }
serde = { version = "1.0.228", features = [ "derive" ] }
serde_json = { version = "1.0.149", features = [ "arbitrary_precision" ] }
sha1 = "0.10.6"
xml-rs = "1.0.0"
clap = { version = "4.5.54", features = [ "derive" ] }

[dev-dependencies]
tempfile = "3.24.0"

[lints]
workspace = true

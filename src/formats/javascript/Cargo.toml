[package]
name = "ctb-formats-javascript"
edition = "2024"

[lib]
path="javascript.rs"
crate-type = ["lib"]

[[bin]]
name = "js-lint"
path = "js-lint/main.rs"

[[bin]]
name = "ts-check"
path = "ts-check/main.rs"

[[bin]]
name = "js-test"
path = "js-test/main.rs"

[dependencies]
ctb-utilities = { path = "../../utilities" }
ctb-formats-javascript-boa-host = { path = "boa_host" }
ctb-formats-javascript-bootstrap-ts = { path = "bootstrap_ts" }
ctb-formats-json = { path = "../json" }
#ctb-formats-ctb-asset-bundle = { path = "../ctb_asset_bundle" }
ctb-storage = { path = "../../storage" }
#ctb-storage-asset-bundle-locator = { path = "../../storage/asset_bundle_locator" }

#boa_string = { version = "0.21.1" }
boa_string = { git = "https://github.com/boa-dev/boa.git", rev = "ffec9244d4267406d66aef8b3c8a1d89730df5b4" }
boa_engine = { git = "https://github.com/boa-dev/boa.git", rev = "ffec9244d4267406d66aef8b3c8a1d89730df5b4", features = ["annex-b"] }
#boa_engine = { version = "0.21.1", features = ["annex-b"] }

deno_lint = "0.84.1"
deno_ast = "0.53.2"
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
walkdir = "2"
glob = "0.3.1"
clap = { version = "4.5.54", features = ["cargo", "derive", "unicode"] }
rayon = "1"
include_dir = { version = "0.7.4", features = ["glob"] }
regex = "1"
once_cell = "1"
tempfile = "3"
tar = "0.4"
tracing = "0.1"

[build-dependencies]
anyhow = "1.0"
ctb-build-support = { path = "../../build_support" }

[lints]
workspace = true


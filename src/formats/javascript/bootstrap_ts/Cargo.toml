[package]
name = "ctb-formats-javascript-bootstrap-ts"
edition = "2024"

[lib]
path = "bootstrap_ts.rs"

[[bin]]
name = "bootstrap_ts"
path = "bin.rs"

[dependencies]
ctb-utilities = { path = "../../../utilities" }
ctb-formats-javascript-boa-host = { path = "../boa_host" }
ctb-formats-json = { path = "../../json" }

anyhow = "1.0"
walkdir = "2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tempfile = "3"
tar = "0.4"
clap = { version = "4.5.54", features = ["cargo", "derive", "unicode"] }

deno_ast = { version = "0.53.2", features = ["transpiling"] }

[package]
name = "ctb-dc-macro"
edition = "2024"
description = """
Procedural derive macro for DcMixed serialization and deserialization.
"""

[lib]
proc-macro = true

[dependencies]
proc-macro2 = { version = "1.0.105", default-features = false }
quote = { version = "1.0" }
syn = { version = "2.0", default-features = false, features = ["full", "parsing", "printing", "proc-macro", "clone-impls"] }

[lints]
workspace = true

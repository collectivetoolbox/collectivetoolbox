[package]
name = "ctb-formats-dcdata"
edition = "2024"

[lib]
path="dcdata.rs"
crate-type = ["lib"]

[[bin]]
name = "validate-data-tables"
path = "bin/validate_data_tables.rs"
test = false

[dependencies]
ctb-utilities = { path = "../../utilities" }
ctb-build-support = { path = "../../build_support" }
ctb-formats-unicode = { path = "../unicode" }
ctb-storage-asset-bundle = { path = "../../storage/asset_bundle" }
ctb-storage-minimal = { path = "../../storage/minimal" }
include_dir = { version = "0.7.4", features = ["glob"] }
regex = "1.12.2"
tempfile = "3.24.0"
csv = "1.4.0"
ctb-formats-dctf = { path = "../dctf" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tinywasm = { version = "0.8.0", default-features = false, features = ["std", "parser", "logging"] }

[build-dependencies]
anyhow = "1.0.100"
ctb-build-support = { path = "../../build_support" }
ctb-utilities = { path = "../../utilities" }

[lints]
workspace = true


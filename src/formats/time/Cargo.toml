[package]
name = "ctb-formats-time"
edition = "2024"

[lib]
path = "time.rs"
crate-type = ["lib"]

[dependencies]
ctb-utilities = { path = "../../utilities" }
ctb-formats-utilities = { path = "../utilities" }
jiff = { version = "0.2.28", default-features = false, features = [
    "std",
    "tzdb-bundle-always",
    "tz-fat",
    "perf-inline",
] }

[lints]
workspace = true

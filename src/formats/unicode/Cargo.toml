[package]
name = "ctb-formats-unicode"
edition = "2024"

[lib]
path="unicode.rs"
crate-type = ["lib"]

[dependencies]
ctb-utilities = { path = "../../utilities" }
ctb-formats-utilities = { path = "../utilities" }
ctb-formats-checksum = { path = "../checksum" }
ctb-storage = { path = "../../storage" }
csv = "1.3.1"
ucd-parse = "0.1.13"
clap = { version = "4.5.54", features = ["derive"] }

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true



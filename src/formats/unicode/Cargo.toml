[package]
name = "ctb-formats-unicode"
edition = "2024"

[lib]
path="unicode.rs"
crate-type = ["lib"]

[dependencies]
ctb-utilities = { path = "../../utilities" }
sha2 = "0.10.9"
ctb-storage-asset-bundle = { path = "../../storage/asset_bundle" }
csv = "1.3.1"
ucd-parse = "0.1.13"
clap = { version = "4.5.54", features = ["derive"] }
icu_properties = "2.2.0"

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true



[package]
name = "ctb-formats-apple-single-double"
edition = "2024"

[lib]
path = "apple_single_double.rs"
crate-type = ["lib"]

[dependencies]
ctb-utilities = { path = "../../utilities" }
ctb-formats-utilities = { path = "../utilities" }
include_dir = { version = "0.7.4", features = ["glob"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = { version = "1.0.149", features = ["arbitrary_precision"] }
clap = { version = "4.5.54", features = ["derive"] }
ctb-formats-dcstring = { path = "../dcstring" }

[lints]
workspace = true

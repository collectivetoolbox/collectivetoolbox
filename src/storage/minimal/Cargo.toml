[package]
name = "ctb-storage-minimal"
edition = "2024"

[lib]
path="minimal.rs"
crate-type = ["lib"]

[dependencies]
ctb-utilities = { path = "../../utilities" }

tempfile = "3.24.0"
include_dir = { version = "0.7.4", features = ["glob"] }
once_cell = "1.21.3"
fs2 = "0.4.3"

[build-dependencies]
ctb-build-support = { path = "../../build_support" }

[lints]
workspace = true

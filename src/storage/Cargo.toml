[package]
name = "ctb-storage"
edition = "2024"

[lib]
path="storage.rs"
crate-type = ["lib"]

[dependencies]
ctb-utilities = { path = "../utilities" }
ctb-formats-ctb-asset-bundle = { path = "../formats/ctb_asset_bundle" }
ctb-formats-dctext = { path = "../formats/dctext" }
ctb-formats-html = { path = "../formats/html" }
ctb-formats-troff = { path = "../formats/troff" }
ctb-storage-asset-bundle-locator = { path = "./asset_bundle_locator" }

serde = "1.0.228"
serde_json = { version = "1.0.149", features = ["arbitrary_precision"] }
handlebars = "6.4.0"
encre-css = "0.20.1"
include_dir = { version = "0.7.4", features = ["glob"] }
glob = "0.3.3"
memmap2 = "0.9.9"
libc = "0.2.186"
uuid = { version = "1.19.0", features = [ "v4", "macro-diagnostics", "js", "serde" ] }
argon2 = "0.5.3"
zeroize = { version = "1.8.2", features = [ "zeroize_derive" ]}
turso = "0.6.1"
tokio = { version = "1.49.0", features = ["full", "tracing"] }
rand = "0.9.2"
base64 = "0.22.1"
sha2 = "0.10.9"
sea-query = "1.0.1"
aes-gcm = "0.11"

[build-dependencies]
anyhow = "1.0.100"
ctb-build-support = { path = "../build_support" }

[dev-dependencies]

[lints]
workspace = true


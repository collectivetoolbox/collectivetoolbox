name: CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:
    inputs:
      run_ci_build:
        description: 'Run standard Build & Core CI'
        required: false
        type: boolean
        default: true
      test_initrd:
        description: 'Build and verify Guix POSIX initrd from scratch'
        required: false
        type: boolean
        default: false
  schedule:
    # Run weekly on Sundays at 03:00 UTC to guard against bit-rot
    - cron: '0 3 * * 0'

jobs:
  build-ci:
    name: Build & Core CI
    if: github.event_name != 'workflow_dispatch' || inputs.run_ci_build
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/collectivetoolbox/collectivetoolbox-2026-sept-5-2:latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Run CI script
        run: ./ci

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ctoolbox-built
          path: |
            built/*/ctoolbox
            built/*/ctoolbox.exe
            built/*/ctoolbox.rsrc
          retention-days: 7

  browser-tests:
    name: Playwright Browser Tests
    needs: build-ci
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/collectivetoolbox/collectivetoolbox-2026-sept-5-2:latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: ctoolbox-built
          path: built/linux-x64

      - name: Ensure binary execution permissions
        run: |
          if [[ -f built/linux-x64/ctoolbox ]]; then
            chmod +x built/linux-x64/ctoolbox
          fi
          if [[ -f built/ctoolbox ]]; then
            chmod +x built/ctoolbox
          fi

      - name: Run Playwright Browser Tests
        run: ./scripts/ci-browser-tests

      - name: Upload browser test results & screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-test-results
          path: |
            built/*.png
            ci-logs/
          retention-days: 7

  verify-initrd:
    name: Guix POSIX Initrd Build Verification
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.test_initrd)
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/collectivetoolbox/collectivetoolbox-2026-sept-5-2:latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build and verify Guix POSIX initrd
        run: ./scripts/ci-test-initrd

      - name: Upload verified initrd artifact
        uses: actions/upload-artifact@v4
        with:
          name: guix-posix-initrd
          path: built/guix_posix_initrd.cpio.gz
          retention-days: 14


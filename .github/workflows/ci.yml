name: CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:
    inputs:
      run_ci_build:
        description: 'Run standard Build & Core CI'
        required: false
        type: boolean
        default: true
      test_initrd:
        description: 'Build and verify Guix POSIX initrd from scratch'
        required: false
        type: boolean
        default: false

jobs:
  build-ci:
    name: Build & Core CI
    if: github.event_name != 'workflow_dispatch' || inputs.run_ci_build
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/collectivetoolbox/collectivetoolbox-2026-sept-5-2:latest
      env:
        WINEPREFIX: /tmp/ctb-wine

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Run CI script
        run: ./ci

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ctoolbox-built
          path: |
            built/*/ctoolbox
            built/*/ctoolbox.exe
            built/*/ctoolbox.rsrc
          retention-days: 7

  browser-tests:
    name: Playwright Browser Tests
    needs: build-ci
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/collectivetoolbox/collectivetoolbox-2026-sept-5-2:latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: ctoolbox-built
          path: built/linux-x64

      - name: Ensure binary execution permissions
        run: |
          if [[ -f built/linux-x64/ctoolbox ]]; then
            chmod +x built/linux-x64/ctoolbox
          fi
          if [[ -f built/ctoolbox ]]; then
            chmod +x built/ctoolbox
          fi

      - name: Run Playwright Browser Tests
        run: ./scripts/ci-browser-tests

      - name: Upload browser test results & screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-test-results
          path: |
            built/*.png
            ci-logs/
          retention-days: 7

  check-weekly-v86:
    name: Check Weekly v86 Build Schedule
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.test_initrd)
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.decide.outputs.should_run }}
      week_key: ${{ steps.get-week.outputs.week_key }}
    steps:
      - name: Get current week
        id: get-week
        run: echo "week_key=$(date +'%G-W%V')" >> "$GITHUB_OUTPUT"

      - name: Check weekly v86 cache
        id: cache-check
        if: github.event_name == 'push'
        uses: actions/cache/restore@v4
        with:
          path: .v86-build-cache
          key: v86-build-${{ steps.get-week.outputs.week_key }}
          lookup-only: true

      - name: Decide if v86 build should run
        id: decide
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "Manual trigger requested. Running v86 initrd build."
            echo "should_run=true" >> "$GITHUB_OUTPUT"
          elif [[ "${{ steps.cache-check.outputs.cache-hit }}" == "true" ]]; then
            echo "v86 initrd build already completed this week (${{ steps.get-week.outputs.week_key }}). Skipping."
            echo "should_run=false" >> "$GITHUB_OUTPUT"
          else
            echo "First push of the week (${{ steps.get-week.outputs.week_key }}). Running v86 initrd build."
            echo "should_run=true" >> "$GITHUB_OUTPUT"
          fi

  verify-initrd:
    name: Guix POSIX Initrd Build Verification
    needs: check-weekly-v86
    if: needs.check-weekly-v86.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/collectivetoolbox/collectivetoolbox-2026-sept-5-2:latest
      env:
        RUSTUP_HOME: /root/.rustup
        CARGO_HOME: /root/.cargo

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build and verify Guix POSIX initrd
        run: ./scripts/ci-test-initrd

      - name: Upload verified initrd artifact
        uses: actions/upload-artifact@v4
        with:
          name: guix-posix-initrd
          path: built/guix_posix_initrd.cpio.gz
          retention-days: 14

      - name: Record weekly v86 build stamp
        if: github.event_name == 'push'
        run: |
          mkdir -p .v86-build-cache
          echo "${{ github.sha }}" > .v86-build-cache/stamp

      - name: Save weekly v86 build cache
        if: github.event_name == 'push'
        uses: actions/cache/save@v4
        with:
          path: .v86-build-cache
          key: v86-build-${{ needs.check-weekly-v86.outputs.week_key }}


